<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ringcon Go - Conductores</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-title {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        #login-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .btn-google {
            background-color: white;
            color: #1f2937;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s;
        }

        .btn-google:hover {
            background-color: #f3f4f6;
        }

        #app-content {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-logout {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            color: #ef4444;
            border-color: #ef4444;
        }

        .orders-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .order-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: border-color 0.2s ease;
        }

        .order-card:hover {
            border-color: var(--accent-color);
        }

        .order-id {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .order-details {
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .btn-action {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="spinner"></div>
        <div class="loader-title">Ringcon Go Conductores</div>
    </div>

    <div id="login-screen">
        <div class="login-card">
            <div class="login-title">Bienvenido</div>
            <div class="login-subtitle">Inicia sesión con tu cuenta de Google para acceder al panel de conductores.</div>
            <button class="btn-google" onclick="iniciarSesionGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.3 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.18C.43 8.12 0 9.81 0 12s.43 3.88 1.18 5.39l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.7 1.18 6.61l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Continuar con Google
            </button>
        </div>
    </div>

    <div id="app-content">
        <header>
            <h1>Ringcon Go <span style="color: var(--accent-color); font-weight: 400;">Conductores</span></h1>
            <div class="user-info">
                <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </header>

        <main>
            <div id="lista-pedidos" class="orders-container">
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDKrQcRn5zbW9VD1GBsgdAh6U1bOG...",
    authDomain: "ringcon-go.firebaseapp.com",
    projectId: "ringcon-go",
    storageBucket: "ringcon-go.firebasestorage.app",
    messagingSenderId: "868935005608",
    appId: "1:868935005608:web:82b9d581ffeaf689f2d99d",
    measurementId: "G-E628RBVYP"
}; 




        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let unsubscribeOrders = null;

        // Capturar el resultado al volver de la redirección de Google
        getRedirectResult(auth).catch((error) => {
            console.error("Error en redirect de Google:", error);
        });

        onAuthStateChanged(auth, (user) => {
            const loader = document.getElementById('loader-screen');
            const loginScreen = document.getElementById('login-screen');
            const appContent = document.getElementById('app-content');

            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 400);

            if (user) {
                loginScreen.style.display = 'none';
                appContent.style.display = 'block';
                iniciarEscuchaPedidos();
            } else {
                appContent.style.display = 'block';
                loginScreen.style.display = 'flex';
                if (unsubscribeOrders) unsubscribeOrders();
            }
        });

        // Usar signInWithRedirect para evitar bloqueos de cookies de terceros y popups
        window.iniciarSesionGoogle = async function() {
            try {
                await signInWithRedirect(auth, provider);
            } catch (error) {
                console.error("Error al iniciar sesión con redirección:", error);
                alert("No se pudo iniciar sesión. Por favor, inténtalo de nuevo.");
            }
        };

        window.cerrarSesion = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Error al cerrar sesión:", error);
            }
        };

        function iniciarEscuchaPedidos() {
            const q = query(collection(db, "orders"), where("status", "==", "LISTO_PARA_RETIRAR"));
            const contenedor = document.getElementById("lista-pedidos");

            unsubscribeOrders = onSnapshot(q, (querySnapshot) => {
                contenedor.innerHTML = "";
                
                if (querySnapshot.empty) {
                    contenedor.innerHTML = `<div class="empty-state">No hay pedidos disponibles en este momento.</div>`;
                    return;
                }

                querySnapshot.forEach((documento) => {
                    const pedido = documento.data();
                    const idPedido = documento.id;

                    const card = document.createElement("div");
                    card.className = "order-card";
                    card.innerHTML = `
                        <div class="order-id">ID: ${idPedido}</div>
                        <div class="order-details">📦 ${pedido.producto || pedido.item || 'Nuevo pedido disponible'}</div>
                        <button class="btn-action" onclick="aceptarPedido('${idPedido}')">Aceptar Viaje</button>
                    `;
                    contenedor.appendChild(card);
                });
            }, (error) => {
                console.error("Error al escuchar la base de datos:", error);
            });
        }

      window.aceptarPedido = async function(idPedido) {
    try {
        const orderRef = doc(db, "ordenes", idPedido);
        await updateDoc(orderRef, { estado: "EN_CAMINO" });
        alert("Has tomado el pedido con éxito");
    } catch (e) {
        console.error("Error al actualizar el pedido:", e);
        alert("No se pudo aceptar el pedido. Inténtalo de nuevo.");
    }
};
</script>
</body>
</html>
