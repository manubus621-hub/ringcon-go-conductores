<!-- JS LOGIC CORREGIDO -->
    <script>
        // INIT LUCIDE ICONS
        lucide.createIcons();

        // ESTADO GLOBAL
        let isOnline = false;
        let map, chart;
        let tripCountdown;

        // AUTH FUNCTIONS (Corregidas para entrar al hacer clic)
        function loginWithGoogle() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appContainer').classList.remove('hidden');
            initApp();
        }

        function loginWithEmail(e) {
            if(e) e.preventDefault();
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appContainer').classList.remove('hidden');
            initApp();
        }

        function logout() {
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('authScreen').style.display = 'flex';
        }

        // INICIALIZACIÓN APP
        function initApp() {
            initMap();
            initChart();
        }

        // LEAFLET MAP ESTRICTO EN RINCÓN DE LOS SAUCES
        function initMap() {
            if (map) return;

            // Coordenadas centro Rincón de los Sauces
            const rinconCenter = [-37.387, -68.927];

            // Delimitación estricta (Bounds)
            const bounds = L.latLngBounds(
                [-37.420, -68.970], // Sudoeste
                [-37.350, -68.880]  // Noreste
            );

            map = L.map('map', {
                center: rinconCenter,
                zoom: 14,
                minZoom: 13,
                maxZoom: 17,
                maxBounds: bounds,
                maxBoundsViscosity: 1.0 // Impide arrastrar fuera del límite
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Marcador Conductor
            const driverIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="w-8 h-8 bg-rose-600 border-2 border-white rounded-full flex items-center justify-center text-white shadow-lg"><i data-lucide="car" class="w-4 h-4"></i></div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            L.marker(rinconCenter, { icon: driverIcon }).addTo(map).bindPopup('<b>Tu ubicación</b><br>Rincón de los Sauces').openPopup();

            // Puntos de Interés Locales
            const spots = [
                { name: "Plaza San Martín", lat: -37.388, lng: -68.928 },
                { name: "Yacimiento Puesto Hernández", lat: -37.365, lng: -68.905 },
                { name: "Hospital Dren Challen", lat: -37.391, lng: -68.922 },
                { name: "Terminal de Ómnibus", lat: -37.384, lng: -68.932 }
            ];

            spots.forEach(spot => {
                L.circleMarker([spot.lat, spot.lng], {
                    radius: 6,
                    color: '#e11d48',
                    fillColor: '#e11d48',
                    fillOpacity: 0.6
                }).addTo(map).bindPopup(spot.name);
            });
        }

        // CAMBIO DE TAB
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-rose-500', 'bg-rose-500/10');
                el.classList.add('text-gray-400');
            });

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tabId}`);
            activeNav.classList.remove('text-gray-400');
            activeNav.classList.add('text-rose-500', 'bg-rose-500/10');

            if (tabId === 'map' && map) {
                setTimeout(() => map.invalidateSize(), 100);
            }
        }

        // TOGGLE ONLINE STATUS
        function toggleOnlineStatus() {
            isOnline = !isOnline;
            const btn = document.getElementById('statusToggleBtn');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (isOnline) {
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold border transition bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
                text.innerText = "En línea";
            } else {
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold border transition bg-gray-800 text-gray-400 border-gray-700";
                dot.className = "w-2.5 h-2.5 rounded-full bg-gray-500";
                text.innerText = "Fuera de línea";
            }
        }

        // SIMULACIÓN SOLICITUD VIAJE
        function triggerIncomingTrip() {
            const modal = document.getElementById('tripModal');
            const timerEl = document.getElementById('tripTimer');
            modal.classList.remove('hidden');

            let timeLeft = 15;
            timerEl.innerText = `${timeLeft}s`;

            clearInterval(tripCountdown);
            tripCountdown = setInterval(() => {
                timeLeft--;
                timerEl.innerText = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(tripCountdown);
                    rejectTrip();
                }
            }, 1000);
        }

        function acceptTrip() {
            clearInterval(tripCountdown);
            document.getElementById('tripModal').classList.add('hidden');
            alert('¡Viaje aceptado! Dirigite a Plaza San Martín para buscar al pasajero.');
        }

        function rejectTrip() {
            clearInterval(tripCountdown);
            document.getElementById('tripModal').classList.add('hidden');
        }

        // MODAL COBRAR GANANCIAS
        function openWithdrawModal() {
            document.getElementById('withdrawModal').classList.remove('hidden');
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').classList.add('hidden');
        }

        function submitWithdraw(e) {
            e.preventDefault();
            alert('¡Solicitud de retiro enviada! Las ganancias se acreditarán en tu cuenta bancaria/CVU en breve.');
            closeWithdrawModal();
        }

        // FORMULARIOS GUARDAR
        function saveVehicleData(e) {
            e.preventDefault();
            alert('¡Datos del vehículo y Cédula (CAT) actualizados correctamente!');
        }

        function saveProfileData(e) {
            e.preventDefault();
            const name = document.getElementById('profName').value;
            const email = document.getElementById('profEmail').value;
            document.getElementById('profileDisplayName').innerText = name;
            document.getElementById('profileDisplayEmail').innerText = email;
            alert('¡Perfil de conductor actualizado!');
        }

        // GRÁFICO CHART.JS
        function initChart() {
            const ctx = document.getElementById('earningsChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'],
                    datasets: [{
                        label: 'Ganancias ($)',
                        data: [12000, 15400, 11000, 18200, 22000, 28000, 18200],
                        backgroundColor: '#e11d48',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#9ca3af' } },
                        y: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af' } }
                    }
                }
            });
        }
    </script>
